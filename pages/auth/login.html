<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function () { try { var t = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light"); document.documentElement.setAttribute("data-theme", t); } catch (e) { } })();</script>
  <title>Masuk — Admin Template</title>
  <link rel="stylesheet" href="../../assets/css/app.css">
</head>

<body class="auth-body">
  <div class="auth-card">
    <div class="auth-brand">
      <svg class="auth-logo" viewBox="0 0 208 48" role="img" aria-label="Mutiara">
        <defs>
          <linearGradient id="lgc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0875f"/><stop offset="1" stop-color="#c25a3b"/></linearGradient>
          <radialGradient id="lgp" cx="0.38" cy="0.33" r="0.8"><stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#fbeee8"/><stop offset="1" stop-color="#e4c7b8"/></radialGradient>
        </defs>
        <rect x="2" y="2" width="44" height="44" rx="13" fill="url(#lgc)"/>
        <circle cx="24" cy="24" r="12.5" fill="url(#lgp)"/>
        <ellipse cx="24" cy="30" rx="8.5" ry="3.4" fill="#c79a86" opacity="0.35"/>
        <ellipse cx="19.8" cy="19.5" rx="4" ry="2.8" fill="#ffffff" opacity="0.9"/>
        <text x="60" y="31" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.5" fill="currentColor">Mutia<tspan fill="var(--accent)">ra</tspan></text>
      </svg>
    </div>
    <h1>Selamat datang kembali</h1>
    <p class="auth-sub">Masuk untuk melanjutkan ke dashboard.</p>

    <form onsubmit="return false">
      <div class="form-group">
        <label class="form-label">Email atau Username</label>
        <input type="text" class="form-control" placeholder="nama@email.com">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-password">
          <input type="password" class="form-control" placeholder="••••••••">
          <button type="button" class="toggle-eye" title="Tampilkan/sembunyikan">
            <i data-lucide="eye" class="eye-on"></i><i data-lucide="eye-off" class="eye-off"></i>
          </button>
        </div>
      </div>
      <div class="auth-row">
        <label class="form-check"><input type="checkbox"> Ingat saya</label>
        <a class="link" href="../../pages/auth/forgot-password.html">Lupa password?</a>
      </div>
      <div class="auth-actions">
        <button class="btn primary">Masuk</button>
      </div>
    </form>

    <div class="auth-foot">Belum punya akun? <a class="link" href="../../pages/auth/register.html">Daftar</a></div>
  </div>

  <script src="../../assets/vendor/lucide/lucide-0.294.0.min.js"></script>
  <script src="../../assets/js/app.js"></script>
</body>

</html>
