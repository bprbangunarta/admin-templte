<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function () { try { var t = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light"); document.documentElement.setAttribute("data-theme", t); } catch (e) { } })();</script>
  <title>Reset Password — Admin Template</title>
  <link rel="stylesheet" href="/assets/css/app.css">
</head>

<body class="auth-body">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="logo">A</div>
      <div class="name">Admin Panel</div>
    </div>
    <h1>Atur ulang password</h1>
    <p class="auth-sub">Buat password baru untuk akun Anda.</p>

    <form onsubmit="return false">
      <div class="form-group">
        <label class="form-label">Password Baru</label>
        <div class="input-password">
          <input type="password" class="form-control" placeholder="Minimal 8 karakter">
          <button type="button" class="toggle-eye" title="Tampilkan/sembunyikan">
            <i data-lucide="eye" class="eye-on"></i><i data-lucide="eye-off" class="eye-off"></i>
          </button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Konfirmasi Password Baru</label>
        <div class="input-password">
          <input type="password" class="form-control" placeholder="Ulangi password baru">
          <button type="button" class="toggle-eye" title="Tampilkan/sembunyikan">
            <i data-lucide="eye" class="eye-on"></i><i data-lucide="eye-off" class="eye-off"></i>
          </button>
        </div>
      </div>
      <div class="auth-actions">
        <button class="btn primary">Simpan Password Baru</button>
      </div>
    </form>

    <div class="auth-foot"><a class="link" href="/pages/auth/login.html">← Kembali ke halaman masuk</a></div>
  </div>

  <script src="/assets/vendor/lucide/lucide-0.294.0.min.js"></script>
  <script src="/assets/js/app.js"></script>
</body>

</html>
